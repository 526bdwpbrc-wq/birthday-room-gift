  const pw = document.getElementById('pw');
  const err = document.getElementById('err');
  const form = document.getElementById('form');
  const toggle = document.getElementById('toggle');
  const gate = document.getElementById('gate');
  const wxTip = document.getElementById('wx-tip');
  const isWeChat = /MicroMessenger/i.test(navigator.userAgent || '');
  if (isWeChat && wxTip) wxTip.classList.add('show');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏密码' : '显示密码';
  });
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }
  function injectWeChatBanner(html) {
    if (!isWeChat) return html;
    const banner =
      '<div id="wx-open-browser" style="position:fixed;z-index:2147483646;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));' +
      'padding:10px 12px;border:1.5px solid #e6d39a;border-radius:12px;background:rgba(255,248,232,.96);' +
      'color:#6a5428;font:12px/1.55 PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,system-ui,sans-serif;' +
      'letter-spacing:.04em;box-shadow:2px 3px 0 rgba(42,38,34,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">' +
      '<div style="display:flex;gap:10px;align-items:flex-start;">' +
      '<div style="flex:1;"><strong style="color:#8a6a3a;font-weight:600;">建议在浏览器打开</strong>' +
      '<div>点右上角「···」→「在浏览器打开」· 房间在微信里可能仍不稳定</div></div>' +
      '<button type="button" onclick="this.closest(\'#wx-open-browser\').remove()" ' +
      'style="border:1px solid #e6d39a;background:#fff6d8;color:#8a6a3a;border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;flex:none;">知道了</button>' +
      '</div></div>';
    if (/<body[^>]*>/i.test(html)) {
      return html.replace(/<body([^>]*)>/i, '<body$1>' + banner);
    }
    return banner + html;
  }
  function loadDecryptedHtml(html) {
    // Same-document load — WeChat WebView often breaks blob: + location.replace
    const next = injectWeChatBanner(html);
    document.open();
    document.write(next);
    document.close();
  }
  async function unlock(password) {
    const payload = JSON.parse(new TextDecoder().decode(b64ToBytes(PAYLOAD_B64)));
    const key = await deriveKey(password, b64ToBytes(payload.salt), payload.iter);
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct)
    );
    const html = new TextDecoder().decode(plainBuf);
    loadDecryptedHtml(html);
  }

    err.textContent = '';
    gate.classList.add('busy');
    try { await unlock(pw.value); }
