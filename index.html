<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#f3efe6" />
  <title>生日快乐</title>
  <style>
    :root {
      --paper: #f3efe6; --ink: #2a2622; --ink-soft: #5a5248; --line: #3d3630;
      --accent: #c45c4a; --shadow: rgba(42, 38, 34, 0.18);
      --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font); }
    body {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background-image: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.55), transparent 50%), linear-gradient(180deg, #f7f3ea, var(--paper));
    }
    .card {
      width: min(92vw, 360px); border: 2px solid var(--line); border-radius: 14px; padding: 28px 24px 22px;
      background: var(--paper); box-shadow: 4px 5px 0 var(--shadow); text-align: center;
    }
    .eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--ink-soft); margin-bottom: 10px; }
    h1 { font-size: 28px; letter-spacing: .2em; text-indent: .2em; margin-bottom: 10px; }
    .sub { font-size: 13px; color: var(--ink-soft); letter-spacing: .06em; margin-bottom: 18px; line-height: 1.6; }
    .hint {
      font-size: 14px; letter-spacing: .08em; color: var(--ink); margin-bottom: 14px;
      padding: 8px 12px; border: 1.5px dashed var(--line); border-radius: 999px; background: rgba(255,255,255,.45);
    }
    label { display: block; text-align: left; font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 8px; }
    input[type=password], input[type=text] {
      width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
      font-size: 16px; background: #faf7f0; color: var(--ink); outline: none;
    }
    button.primary {
      width: 100%; margin-top: 14px; border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 18px;
      background: var(--ink); color: var(--paper); font-size: 15px; letter-spacing: .12em; cursor: pointer;
      box-shadow: 2px 3px 0 var(--shadow);
    }
    button.ghost { border: none; background: transparent; color: var(--ink-soft); font-size: 12px; letter-spacing: .08em; cursor: pointer; margin-top: 10px; }
    .err { min-height: 1.4em; margin-top: 12px; font-size: 13px; color: var(--accent); }
    .busy button.primary { opacity: .7; pointer-events: none; }
  </style>
</head>
<body>
  <div class="card" id="gate">
    <p class="eyebrow">PASSWORD GATE</p>
    <h1>生日快乐</h1>
    <p class="sub">输入密码后推开门<br/>这份小礼物只给你</p>
    <form id="form">
      <p class="hint" id="pw-hint">恋爱故事开始的那天</p>
      <label for="pw">访问密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="请输入密码" required />
      <button class="primary" type="submit" id="go">打开礼物</button>
      <button class="ghost" type="button" id="toggle">显示密码</button>
      <p class="err" id="err" aria-live="polite"></p>
    </form>
  </div>

  const pw = document.getElementById('pw');
  const err = document.getElementById('err');
  const form = document.getElementById('form');
  const toggle = document.getElementById('toggle');
  const gate = document.getElementById('gate');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏密码' : '显示密码';
  });
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }
  async function unlock(password) {
    const payload = JSON.parse(new TextDecoder().decode(b64ToBytes(PAYLOAD_B64)));
    const key = await deriveKey(password, b64ToBytes(payload.salt), payload.iter);
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct)
    );
    const html = new TextDecoder().decode(plainBuf);
    // Blob navigation keeps ES modules / import maps working (document.write does not)
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    location.replace(url);
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    gate.classList.add('busy');
    try { await unlock(pw.value); }
    catch (ex) {
      console.error(ex);
      err.textContent = '密码不对，再试一次';
      gate.classList.remove('busy');
      pw.select();
    }
  });
  pw.focus();
