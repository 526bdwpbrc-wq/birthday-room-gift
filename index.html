  <style>

    * { box-sizing:border-box; margin:0; padding:0; }

    body { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;

    .card { width:min(92vw,360px); border:2px solid var(--line); border-radius:14px; padding:28px 24px 22px; background:var(--paper); box-shadow:4px 5px 0 var(--shadow); text-align:center; }
    .eyebrow { font-size:11px; letter-spacing:.16em; color:var(--ink-soft); margin-bottom:10px; }
    .build { display:inline-block; margin-bottom:12px; font-size:11px; letter-spacing:.08em; color:#8a6a3a; background:#fff6d8; border:1px solid #e6d39a; border-radius:999px; padding:4px 10px; }
    h1 { font-size:28px; letter-spacing:.2em; text-indent:.2em; margin-bottom:10px; }
    .sub { font-size:13px; color:var(--ink-soft); letter-spacing:.06em; margin-bottom:18px; line-height:1.6; }
    .hint { font-size:14px; letter-spacing:.08em; color:var(--ink); margin-bottom:14px; padding:8px 12px; border:1.5px dashed var(--line); border-radius:999px; background:rgba(255,255,255,.45); }
    label { display:block; text-align:left; font-size:12px; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:8px; }
    input { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-size:16px; background:#faf7f0; color:var(--ink); outline:none; }
    button.primary { width:100%; margin-top:14px; border:1.5px solid var(--line); border-radius:999px; padding:12px 18px; background:var(--ink); color:var(--paper); font-size:15px; letter-spacing:.12em; cursor:pointer; box-shadow:2px 3px 0 var(--shadow); }
    button.ghost { border:none; background:transparent; color:var(--ink-soft); font-size:12px; letter-spacing:.08em; cursor:pointer; margin-top:10px; }
    .err { min-height:1.4em; margin-top:12px; font-size:13px; color:var(--accent); }
    .busy button.primary { opacity:.7; pointer-events:none; }
  </style>

  const pw = document.getElementById('pw');
  const err = document.getElementById('err');
  const form = document.getElementById('form');
  const toggle = document.getElementById('toggle');
  const gate = document.getElementById('gate');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏密码' : '显示密码';
  });
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }
  async function unlock(password) {
    const payload = JSON.parse(new TextDecoder().decode(b64ToBytes(PAYLOAD_B64)));
    const key = await deriveKey(password, b64ToBytes(payload.salt), payload.iter);
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.ct)
    );
    const html = new TextDecoder().decode(plainBuf);
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    location.replace(url);
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    gate.classList.add('busy');
    try { await unlock(pw.value); }
    catch (ex) {
      console.error(ex);
      err.textContent = '密码不对，再试一次';
      gate.classList.remove('busy');
      pw.select();
    }
  });
  pw.focus();
